```yaml
name: Detector de noticias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  detectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Detectar noticias nuevas
        run: python detector.py

      - name: Generar publicaciones
        run: python mensaje.py

      - name: Comprobar publicaciones
        id: publicacion
        run: |
          if [ -f "PUBLICAR_EN_WHATSAPP.txt" ]; then
            echo "hay_publicacion=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_publicacion=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar publicación
        if: steps.publicacion.outputs.hay_publicacion == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PUBLICAR-EN-WHATSAPP
          path: PUBLICAR_EN_WHATSAPP.txt

      - name: Guardar memoria
        run: |
          git config user.name "CD Estepona Fans Bot"
          git config user.email "bot@cdesteponafans.com"

          git add noticias_procesadas.txt

          if git diff --cached --quiet; then
            echo "No hay cambios en la memoria."
          else
            git commit -m "Actualizar noticias procesadas"
            git push
          fi
```
