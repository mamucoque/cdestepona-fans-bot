name: Detector de noticias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  detectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar detector
        run: python detector.py

      - name: Guardar memoria
        run: |
          git config user.name "CD Estepona Fans Bot"
          git config user.email "bot@cdesteponafans.com"

          git add ultima_noticia.txt

          if git diff --cached --quiet; then
            echo "No hay cambios en la memoria."
          else
            git commit -m "Actualizar memoria del detector"
            git push
          fi
